name: isometrix
description: "IsometriX — offline-first home isometric training coach."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  wakelock_plus: ^1.2.10
  audioplayers: ^6.4.0
  flutter_local_notifications: ^19.0.0
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  collection: ^1.19.1
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  riverpod_generator: ^2.6.5
  integration_test:
    sdk: flutter
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/fonts/
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
